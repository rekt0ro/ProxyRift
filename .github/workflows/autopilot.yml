name: ProxyRift Autopilot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update Configs
    types:
      - completed
    branches:
      - main

permissions:
  actions: write
  contents: read

concurrency:
  group: proxyrift-autopilot
  cancel-in-progress: false

jobs:
  oversee:
    name: Monitor and recover updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect update health and recover safely
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GH_REPOSITORY"
          runs_endpoint="/repos/$repo/actions/workflows/update.yml/runs?per_page=20&branch=main&exclude_pull_requests=true"

          fail() {
            echo "::error::$*"
            {
              echo "## ProxyRift Autopilot: attention required"
              echo
              echo "$*"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          dispatch_update() {
            echo "[INFO] No healthy update run is recent enough; dispatching Update Configs."
            gh api --method POST "/repos/$repo/actions/workflows/update.yml/dispatches" -f ref=main >/dev/null
            {
              echo "## ProxyRift Autopilot"
              echo
              echo "Dispatched a recovery run of **Update Configs** on \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          validate_published_outputs() {
            local base="https://raw.githubusercontent.com/$repo/main/subscriptions"
            local tmp
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' RETURN

            local files=(
              all.txt light.txt
              all-base64.txt light-base64.txt
              all-clash.yaml light-clash.yaml
              all-singbox.json light-singbox.json
            )

            for file in "${files[@]}"; do
              echo "[INFO] Checking subscriptions/$file"
              if ! curl --fail --silent --show-error --location \
                  --retry 3 --retry-delay 3 --retry-all-errors \
                  "$base/$file?autopilot_check=$(date +%s)" \
                  --output "$tmp/$file"; then
                fail "Published output subscriptions/$file could not be fetched."
              fi
              if [ ! -s "$tmp/$file" ]; then
                fail "Published output subscriptions/$file is empty."
              fi
            done

            local light_count all_count
            light_count="$(awk 'NF && $0 !~ /^#/ { n++ } END { print n + 0 }' "$tmp/light.txt")"
            all_count="$(awk 'NF && $0 !~ /^#/ { n++ } END { print n + 0 }' "$tmp/all.txt")"

            if (( light_count < 50 )); then
              fail "Published Light subscription has $light_count entries; expected at least 50. The publication gate should prevent this."
            fi
            if (( all_count < 1 )); then
              fail "Published All subscription has no entries."
            fi

            for name in light all; do
              if ! base64 --decode "$tmp/$name-base64.txt" > "$tmp/$name-decoded.txt"; then
                fail "Published $name Base64 subscription cannot be decoded."
              fi
              if ! cmp --silent "$tmp/$name.txt" "$tmp/$name-decoded.txt"; then
                fail "Published $name Base64 output does not match $name.txt."
              fi
            done

            for name in light all; do
              if ! jq --exit-status \
                'type == "object" and (.outbounds | type == "array") and (.outbounds | length > 0)' \
                "$tmp/$name-singbox.json" >/dev/null; then
                fail "Published $name sing-box output is not valid JSON with at least one outbound."
              fi
              if ! grep --quiet --extended-regexp '^proxies:[[:space:]]*$' "$tmp/$name-clash.yaml" \
                  || ! grep --quiet --extended-regexp '^[[:space:]]+- name:' "$tmp/$name-clash.yaml"; then
                fail "Published $name Clash output has no proxy entries."
              fi
            done

            {
              echo "## ProxyRift output health"
              echo
              echo "- Light entries: **$light_count** (minimum: 50)"
              echo "- All entries: **$all_count**"
              echo "- Base64 mirrors: valid"
              echo "- sing-box JSON: valid"
              echo "- Clash outputs: proxy entries present"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "[OK] Published outputs passed integrity checks (Light=$light_count, All=$all_count)."
          }

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            run_id="$(jq -r '.workflow_run.id' "$EVENT_PATH")"
            run_name="$(jq -r '.workflow_run.name' "$EVENT_PATH")"
            conclusion="$(jq -r '.workflow_run.conclusion // "unknown"' "$EVENT_PATH")"
            attempt="$(jq -r '.workflow_run.run_attempt // 1' "$EVENT_PATH")"

            if [[ "$run_name" != "Update Configs" ]]; then
              echo "[INFO] Ignoring unrelated workflow: $run_name"
              exit 0
            fi

            if [[ "$conclusion" == "success" ]]; then
              validate_published_outputs
              exit 0
            fi

            if [[ "$conclusion" == "failure" || "$conclusion" == "timed_out" ]]; then
              if (( attempt < 2 )); then
                echo "[WARN] Update Configs run $run_id failed on attempt $attempt; retrying its failed jobs once."
                gh api --method POST "/repos/$repo/actions/runs/$run_id/rerun-failed-jobs" >/dev/null
                {
                  echo "## ProxyRift Autopilot"
                  echo
                  echo "Update Configs failed on attempt $attempt. Requested one automatic retry of failed jobs."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              fail "Update Configs run $run_id failed again after automatic retry (attempt $attempt). Inspect the [workflow run](https://github.com/$repo/actions/runs/$run_id)."
            fi

            echo "[INFO] Update Configs ended with conclusion '$conclusion'; no automatic retry was attempted."
            {
              echo "## ProxyRift Autopilot"
              echo
              echo "Update Configs concluded with \`$conclusion\`. No retry was attempted for this outcome."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          runs="$(gh api "$runs_endpoint")"
          now="$(date -u +%s)"

          active_run="$(jq -c '
            [.workflow_runs[]
              | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested")]
            | sort_by(.created_at)
            | last // empty
          ' <<< "$runs")"

          if [[ -n "$active_run" ]]; then
            run_id="$(jq -r '.id' <<< "$active_run")"
            status="$(jq -r '.status' <<< "$active_run")"
            started_at="$(jq -r '.run_started_at // .created_at' <<< "$active_run")"
            started_epoch="$(date -u -d "$started_at" +%s)"
            age=$(( now - started_epoch ))

            if (( age >= 4500 )); then
              echo "[WARN] Update Configs run $run_id has been $status for ${age}s; cancelling the stale run and dispatching a replacement."
              gh api --method POST "/repos/$repo/actions/runs/$run_id/cancel" >/dev/null || true
              dispatch_update
            else
              echo "[OK] Update Configs run $run_id is $status and is not stale (${age}s)."
              {
                echo "## ProxyRift Autopilot"
                echo
                echo "Update Configs run [$run_id](https://github.com/$repo/actions/runs/$run_id) is \`$status\`; no duplicate run was started."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          latest_run="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$runs")"
          if [[ -z "$latest_run" ]]; then
            echo "[WARN] No Update Configs run was found on main."
            dispatch_update
            exit 0
          fi

          latest_id="$(jq -r '.id' <<< "$latest_run")"
          latest_created="$(jq -r '.created_at' <<< "$latest_run")"
          latest_epoch="$(date -u -d "$latest_created" +%s)"
          age=$(( now - latest_epoch ))

          if (( age >= 5400 )); then
            echo "[WARN] Latest Update Configs run $latest_id was created ${age}s ago; dispatching a recovery run."
            dispatch_update
          else
            conclusion="$(jq -r '.conclusion // .status' <<< "$latest_run")"
            echo "[OK] Update Configs has recent activity (latest run $latest_id, state=$conclusion, age=${age}s)."
            {
              echo "## ProxyRift Autopilot"
              echo
              echo "Update Configs has recent activity; latest run [$latest_id](https://github.com/$repo/actions/runs/$latest_id) is \`$conclusion\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
