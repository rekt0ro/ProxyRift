name: Update Configs

# External scheduler: cron-job.org triggers workflow_dispatch on the desired cadence.
on:
  workflow_dispatch:

concurrency:
  group: update-configs
  cancel-in-progress: false

permissions:
  contents: read

env:
  XRAY_REPOSITORY: "XTLS/Xray-core"
  SINGBOX_REPOSITORY: "SagerNet/sing-box"
  LIGHT_MIN_PUBLISH: "50"
  ALL_MIN_PUBLISH: "1000"
  LIGHT_SELECTION_LIMIT: "200"
  ALL_MAX_PUBLISH: "2000"

jobs:
  collect:
    name: "Collect & Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROXYRIFT_LOG_MODE: "compact"
    permissions:
      actions: read
      contents: write
    outputs:
      rust_toolchain_key: ${{ steps.prepare.outputs.rust_toolchain_key }}
      registry_key: ${{ steps.prepare.outputs.registry_key }}
      build_key: ${{ steps.prepare.outputs.build_key }}
      xray_key: ${{ steps.prepare.outputs.xray_key }}
      singbox_key: ${{ steps.prepare.outputs.singbox_key }}
      mihomo_key: ${{ steps.prepare.outputs.mihomo_key }}

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v7
        with:
          fetch-depth: 16
          show-progress: false

      - name: Prepare update environment
        id: prepare
        uses: ./.github/actions/prepare-update
        with:
          lock_hash: ${{ hashFiles('Cargo.lock') }}
          source_hash: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build.rs', '**/*.rs') }}
          runner_os: ${{ runner.os }}
          runner_arch: ${{ runner.arch }}
          github_token: ${{ github.token }}

      - name: "Discover GitHub subscription sources"
        id: discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./target/release/discover_sources

      - name: "Collect & transport-test configs"
        id: collect_transport
        run: |
          ./target/release/ProxyRift

      - name: "Build Light subscription"
        id: build_light
        run: python3 scripts/update/build_light_subscription.py


      - name: "Generate subscriptions"
        id: generate_base64
        run: |
          ./target/release/encode_subscriptions

      - name: "Prepare published outputs"
        id: prepare_outputs
        run: python3 scripts/update/prepare_published_outputs.py
      - name: "Publish generated changes"
        id: publish
        run: python3 scripts/update/publish_generated_changes.py

      - name: Write run summary and archive reports
        if: always()
        uses: ./.github/actions/finalize-update
        with:
          job_status: ${{ job.status }}
          discovery_outcome: ${{ steps.discovery.outcome }}
          collect_outcome: ${{ steps.collect_transport.outcome }}
          light_outcome: ${{ steps.build_light.outcome }}
          generation_outcome: ${{ steps.generate_base64.outcome }}
          prepare_outcome: ${{ steps.prepare_outputs.outcome }}
          publish_outcome: ${{ steps.publish.outcome }}
          xray_version: ${{ steps.prepare.outputs.xray_version }}
          singbox_version: ${{ steps.prepare.outputs.singbox_version }}
          mihomo_version: ${{ steps.prepare.outputs.mihomo_version }}
          github_token: ${{ github.token }}
          github_repository: ${{ github.repository }}

      - name: Persist Light learning state
        if: always() && steps.build_light.outcome == 'success' && steps.prepare_outputs.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update/publish_light_state.py

  cleanup:
    if: always()
    name: "Cleanup Caches"
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: "Clean obsolete caches"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
          RUST_TOOLCHAIN_KEY: ${{ needs.collect.outputs.rust_toolchain_key }}
          REGISTRY_KEY: ${{ needs.collect.outputs.registry_key }}
          BUILD_KEY: ${{ needs.collect.outputs.build_key }}
          XRAY_KEY: ${{ needs.collect.outputs.xray_key }}
          SINGBOX_KEY: ${{ needs.collect.outputs.singbox_key }}
          MIHOMO_KEY: ${{ needs.collect.outputs.mihomo_key }}
        shell: bash
        run: bash scripts/update/cleanup_caches.sh
