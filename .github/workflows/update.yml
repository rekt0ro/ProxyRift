name: Update Configs (Compatibility Trigger)

# Keep this filename stable: the external scheduler and autopilot dispatch to it.
# The implementation lives in update-configs.yml.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update-configs:
    uses: ./.github/workflows/update-configs.yml
    permissions:
      actions: write
      contents: write
