name: Update Configs

# External scheduler: cron-job.org triggers workflow_dispatch on the desired cadence.
on:
  workflow_dispatch:

concurrency:
  group: update-configs
  cancel-in-progress: false

permissions:
  contents: read

env:
  XRAY_REPOSITORY: "XTLS/Xray-core"
  SINGBOX_REPOSITORY: "SagerNet/sing-box"
  LIGHT_MIN_PUBLISH: "50"

jobs:
  collect:
    name: "🔎 Collect & Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    outputs:
      rust_toolchain_key: ${{ steps.keys.outputs.rust-toolchain }}
      registry_key: ${{ steps.keys.outputs.registry }}
      build_key: ${{ steps.keys.outputs.build }}
      xray_key: ${{ steps.keys.outputs.xray }}
      singbox_key: ${{ steps.keys.outputs.singbox }}

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: "🦀 Resolve stable Rust toolchain"
        id: rust-toolchain
        run: bash scripts/update/resolve_stable_rust.sh
      - name: "🦀 Restore Rust toolchain cache"
        id: rust-toolchain-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.rustup/toolchains
          key: ${{ runner.os }}-${{ runner.arch }}-rust-toolchain-${{ steps.rust-toolchain.outputs.version }}

      - name: "🦀 Set up Rust"
        env:
          RUST_TOOLCHAIN_VERSION: ${{ steps.rust-toolchain.outputs.version }}
        run: bash scripts/update/setup_rust.sh
      - name: "📌 Record Rust version"
        id: rust-version
        env:
          RUST_TOOLCHAIN_VERSION: ${{ steps.rust-toolchain.outputs.version }}
        run: bash scripts/update/record_rust_version.sh
      - name: "🔒 Verify dependency lock"
        run: test -s Cargo.lock

      - name: "🧠 Install native LightGBM runtime"
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/install_lightgbm.sh

      - name: "🌐 Resolve pinned validation cores"
        id: validation-cores
        env:
          XRAY_VERSION_PIN: "26.3.27"
          XRAY_SHA256_PIN: "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae"
          XRAY_ASSET_PIN: "Xray-linux-64.zip"
          SINGBOX_VERSION_PIN: "1.14.2"
          SINGBOX_SHA256_PIN: "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6"
          SINGBOX_ASSET_PIN: "sing-box-1.14.2-linux-amd64.tar.gz"
        run: bash scripts/update/resolve_validation_cores.sh
      - name: "⚡ Compute cache keys"
        id: keys
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
          LOCK_HASH: ${{ hashFiles('Cargo.lock') }}
          RUST_VERSION: ${{ steps.rust-version.outputs.version }}
          XRAY_VERSION: ${{ steps.validation-cores.outputs.xray_version }}
          XRAY_SHA256: ${{ steps.validation-cores.outputs.xray_sha256 }}
          SINGBOX_VERSION: ${{ steps.validation-cores.outputs.singbox_version }}
          SINGBOX_SHA256: ${{ steps.validation-cores.outputs.singbox_sha256 }}
        run: bash scripts/update/compute_cache_keys.sh
      - name: "💾 Restore Rust registry cache"
        id: cargo-registry-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.keys.outputs.registry }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: "💾 Restore Rust build cache"
        id: cargo-build-restore
        uses: actions/cache/restore@v6
        with:
          path: target
          key: ${{ steps.keys.outputs.build }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-rust-${{ steps.rust-version.outputs.version }}-

      - name: "📦 Restore Xray binary cache"
        id: xray-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/bin/xray
          key: ${{ steps.keys.outputs.xray }}

      - name: "🛡️ Install Xray (latest stable, checksum-verified)"
        env:
          XRAY_VERSION: ${{ steps.validation-cores.outputs.xray_version }}
          XRAY_SHA256: ${{ steps.validation-cores.outputs.xray_sha256 }}
          XRAY_ASSET: ${{ steps.validation-cores.outputs.xray_asset }}
        run: bash scripts/update/install_xray.sh
      - name: "💾 Save Xray binary cache"
        if: steps.xray-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.local/bin/xray
          key: ${{ steps.keys.outputs.xray }}

      - name: "📦 Restore sing-box binary cache"
        id: singbox-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/bin/sing-box
          key: ${{ steps.keys.outputs.singbox }}

      - name: "🛡️ Install sing-box (latest stable, checksum-verified)"
        env:
          SINGBOX_VERSION: ${{ steps.validation-cores.outputs.singbox_version }}
          SINGBOX_SHA256: ${{ steps.validation-cores.outputs.singbox_sha256 }}
          SINGBOX_ASSET: ${{ steps.validation-cores.outputs.singbox_asset }}
        run: bash scripts/update/install_singbox.sh
      - name: "💾 Save sing-box binary cache"
        if: steps.singbox-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.local/bin/sing-box
          key: ${{ steps.keys.outputs.singbox }}

      - name: "✨ Validate Rust formatting"
        run: cargo fmt --all -- --check

      - name: "🌍 Check runner network"
        run: bash scripts/update/check_runner_network.sh
      - name: "🔨 Build Rust binaries"
        run: bash scripts/update/build_rust_binaries.sh
      - name: "💾 Save Rust toolchain cache"
        if: steps.rust-toolchain-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.rustup/toolchains
          key: ${{ steps.keys.outputs.rust-toolchain }}

      - name: "💾 Save Rust registry cache"
        if: steps.cargo-registry-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.keys.outputs.registry }}

      - name: "💾 Save Rust build cache"
        if: steps.cargo-build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: target
          key: ${{ steps.keys.outputs.build }}

      - name: "🔭 Discover GitHub subscription sources"
        id: discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./target/release/discover_sources

      - name: "🔎 Collect & transport-test configs"
        id: collect_transport
        run: |
          ./target/release/ProxyRift

      - name: "💡 Build Light subscription"
        id: build_light
        env:
          LIGHT_MAX_CANDIDATES: "15000"
          LIGHT_SELECTION_LIMIT: "200"
          PROXYRIFT_LOG_MODE: "compact"
        run: bash scripts/update/build_light_subscription.sh

      - name: "🧬 Generate subscriptions"
        id: generate_base64
        run: |
          ./target/release/encode_subscriptions

      - name: "📦 Prepare published outputs"
        id: prepare_outputs
        run: bash scripts/update/prepare_published_outputs.sh
      - name: "🚀 Publish generated changes"
        id: publish
        run: bash scripts/update/publish_generated_changes.sh

      - name: "📊 Write run summary"
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect_transport.outcome }}
          LIGHT_OUTCOME: ${{ steps.build_light.outcome }}
          GENERATION_OUTCOME: ${{ steps.generate_base64.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare_outputs.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          XRAY_VERSION: ${{ steps.validation-cores.outputs.xray_version }}
          SINGBOX_VERSION: ${{ steps.validation-cores.outputs.singbox_version }}
        run: bash scripts/update/write_run_summary.sh

  cleanup:
    name: "🧹 Cleanup Caches"
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: "🧹 Clean obsolete caches"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
          RUST_TOOLCHAIN_KEY: ${{ needs.collect.outputs.rust_toolchain_key }}
          REGISTRY_KEY: ${{ needs.collect.outputs.registry_key }}
          BUILD_KEY: ${{ needs.collect.outputs.build_key }}
          XRAY_KEY: ${{ needs.collect.outputs.xray_key }}
          SINGBOX_KEY: ${{ needs.collect.outputs.singbox_key }}
        shell: bash
        run: bash scripts/update/cleanup_caches.sh
