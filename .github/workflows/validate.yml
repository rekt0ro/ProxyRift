name: CI

on:
  push:
    branches:
      - "main"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
      - ".ruby-version"
      - ".python-version"
      - "rust-toolchain.toml"
      - "scripts/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
      - ".ruby-version"
      - ".python-version"
      - "rust-toolchain.toml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Verify Python version pin
        run: |
          python --version
          python -c 'import pathlib, sys; expected = pathlib.Path(".python-version").read_text().strip(); actual = ".".join(map(str, sys.version_info[:3])); assert actual == expected, f"Python {actual} does not match .python-version ({expected})"'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Verify Ruby version pin
        run: |
          ruby --version
          ruby -e 'abort "Ruby version does not match .ruby-version" unless RUBY_VERSION == File.read(".ruby-version").strip'

      - name: Validate Ruby source syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/update/*.rb; do
            ruby -c "$script"
          done

      - name: Test Ruby Clash output validator
        run: ruby scripts/update/test_validate_clash_output.rb

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"))["toolchain"]["channel"])')"
          [[ "$version" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          components: clippy, rustfmt

      - name: Record Rust version
        id: rust-version
        env:
          RUST_TOOLCHAIN_VERSION: ${{ steps.rust-toolchain.outputs.version }}
        run: |
          actual_version="$(rustc --version | awk '{print $2}')"
          test "$actual_version" = "$RUST_TOOLCHAIN_VERSION"
          echo "version=$actual_version" >> "$GITHUB_OUTPUT"

      - name: Restore Rust registry cache
        id: cargo-registry-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Restore Rust build cache
        id: cargo-build-restore
        uses: actions/cache/restore@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-rust-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build.rs', '**/*.rs') }}

      - name: Shell syntax check
        run: |
          for script in scripts/*.sh scripts/update/*.sh; do
            [[ -f "$script" ]] || continue
            bash -n "$script" || exit 1
          done

      - name: Validate workflow and composite-action YAML
        run: |
          ruby -e '
            require "yaml"
            paths = Dir.glob(".github/workflows/*.yml") + Dir.glob(".github/actions/**/*.yml")
            abort "No workflow or action YAML files found" if paths.empty?
            paths.each { |path| YAML.parse_file(path) }
            puts "Validated #{paths.length} workflow/action YAML files."
          '

      - name: Validate Python script syntax
        run: python3 -m py_compile scripts/*.py scripts/update/*.py

      - name: Run all Python tests
        shell: bash
        run: |
          set -euo pipefail
          for test_script in scripts/test_*.py scripts/update/test_*.py; do
            [[ -f "$test_script" ]] || continue
            echo "Running $test_script"
            python3 "$test_script"
          done

      - name: Validate core-pin workflow shell syntax
        run: ruby scripts/update/test_core_pin_workflow.rb

      - name: Test Dependabot auto-merge check policy
        run: bash scripts/update/test_dependabot_auto_merge_checks.sh

      - name: Validate Dependabot auto-merge workflow
        run: ruby scripts/update/test_dependabot_auto_merge_workflow.rb
      - name: Test Light validation timeout settings
        run: bash scripts/update/test_light_timeout_settings.sh

      - name: Load pinned core versions for export validation
        shell: bash
        run: ruby scripts/update/load_validation_core_pins.rb >> "$GITHUB_ENV"

      - name: Install pinned sing-box core for export validation
        env:
          SINGBOX_REPOSITORY: "SagerNet/sing-box"
        run: bash scripts/update/install_singbox.sh

      - name: Smoke-test sing-box check on an exported subscription
        shell: bash
        run: |
          config="$(mktemp)"
          trap 'rm -f "$config"' EXIT
          cat > "$config" <<'JSON'
          {
            "$schema": "https://sing-box.sagernet.org/schema.json",
            "outbounds": [
              {
                "type": "direct",
                "tag": "ProxyRift validation smoke test"
              }
            ]
          }
          JSON
          "$HOME/.local/bin/sing-box" check -c "$config"

      - name: Validate published sing-box exports with sing-box
        run: |
          "$HOME/.local/bin/sing-box" check -c subscriptions/light-singbox.json
          "$HOME/.local/bin/sing-box" check -c subscriptions/all-singbox.json

      - name: Install pinned Mihomo core for Clash export validation
        env:
          MIHOMO_REPOSITORY: "MetaCubeX/mihomo"
        run: bash scripts/update/install_mihomo.sh

      - name: Smoke-test Mihomo validation on Clash proxy output
        shell: bash
        run: |
          config="$(mktemp)"
          trap 'rm -f "$config"' EXIT
          cat > "$config" <<'YAML'
          proxies:
            - name: "ProxyRift validation smoke test"
              type: socks5
              server: 127.0.0.1
              port: 1080
          YAML
          "$HOME/.local/bin/mihomo" -t -f "$config"

      - name: Validate published Clash exports with Mihomo
        run: |
          "$HOME/.local/bin/mihomo" -t -f subscriptions/light-clash.yaml
          "$HOME/.local/bin/mihomo" -t -f subscriptions/all-clash.yaml

      - name: Test source-sensitive build cache keys
        run: bash scripts/update/test_compute_cache_keys.sh

      - name: Test Ruby version pin updates
        run: bash scripts/update/test_pin_ruby_version.sh

      - name: Test pinned core release validation
        run: bash scripts/update/test_resolve_validation_cores.sh

      - name: Test cache cleanup safety when keys are unavailable
        run: bash scripts/update/test_cleanup_caches.sh

      - name: Test generated subscription publishing retries
        run: bash scripts/update/test_publish_generated_changes.sh

      - name: Test Light learning-state-only publishing
        run: bash scripts/update/test_publish_light_state.sh

      - name: Install native LightGBM runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/install_lightgbm.py

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --release --all-targets

      - name: Run Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Check whitespace
        run: git diff --check

      - name: Save Rust registry cache
        if: steps.cargo-registry-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}

      - name: Save Rust build cache
        if: steps.cargo-build-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-rust-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build.rs', '**/*.rs') }}
