name: Auto-merge Dependabot

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_run:
    workflows:
      - CI
      - CodeQL
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: dependabot-action-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event_name != 'pull_request_target' ||
      (
        (
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          (
            startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/') ||
            startsWith(github.event.pull_request.head.ref, 'dependabot/cargo/')
          )
        ) ||
        (
          github.event.pull_request.user.login == 'github-actions[bot]' &&
          github.event.pull_request.head.ref == 'automation/update-core-pins'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted merge-gate scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Merge ready Dependabot tooling updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          open_prs="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" | jq 'add')"
          printf '%s\n' "${open_prs}" | jq -r '.[] | "Open PR #\(.number): author=\(.user.login), draft=\(.draft), head=\(.head.ref)"'

          mapfile -t prs < <(
            printf '%s\n' "${open_prs}" | jq -r '
              .[]
              | select((
                  (
                    .user.login == "dependabot[bot]"
                    and (
                      (.head.ref | startswith("dependabot/github_actions/"))
                      or (.head.ref | startswith("dependabot/cargo/"))
                    )
                  )
                  or (
                    .user.login == "github-actions[bot]"
                    and .head.ref == "automation/update-core-pins"
                  )
                ) and .draft == false)
              | .number
            '
          )

          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No open eligible tooling-update PRs."
            exit 0
          fi

          printf 'Eligible tooling-update PRs: %s\n' "${prs[*]}"

          for pr in "${prs[@]}"; do
            echo "Inspecting tooling-update PR #${pr}"

            state="$(gh pr view "${pr}" --repo "${GITHUB_REPOSITORY}" --json state --jq '.state')"
            if [ "${state}" != "OPEN" ]; then
              echo "PR #${pr} is no longer open; skipping."
              continue
            fi

            pr_data="$(printf '%s\n' "${open_prs}" | jq -c --argjson pr "${pr}" '.[] | select(.number == $pr)')"
            pr_author="$(jq -r '.user.login // empty' <<< "${pr_data}")"
            head_ref="$(jq -r '.head.ref // empty' <<< "${pr_data}")"

            mapfile -t files < <(
              gh pr view "${pr}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json files \
                --jq '.files[].path'
            )

            if [ "${#files[@]}" -eq 0 ]; then
              echo "PR #${pr} has no changed files; skipping."
              continue
            fi

            valid=true
            for path in "${files[@]}"; do
              if [[ "${pr_author}" == "dependabot[bot]" ]]; then
                case "${head_ref}" in
                  dependabot/github_actions/*)
                    case "${path}" in
                      .github/workflows/*.yml|.github/workflows/*.yaml|.github/actions/*/action.yml|.github/actions/*/action.yaml|.github/actions/*.yml|.github/actions/*.yaml)
                        ;;
                      *)
                        valid=false
                        echo "PR #${pr} has a file outside the GitHub Actions dependency allowlist: ${path}"
                        ;;
                    esac
                    ;;
                  dependabot/cargo/*)
                    case "${path}" in
                      Cargo.toml|Cargo.lock)
                        ;;
                      *)
                        valid=false
                        echo "PR #${pr} has a file outside the Cargo dependency allowlist: ${path}"
                        ;;
                    esac
                    ;;
                  *)
                    valid=false
                    echo "PR #${pr} has an unrecognized Dependabot update branch: ${head_ref}"
                    ;;
                esac
              elif [[ "${pr_author}" == "github-actions[bot]" && "${head_ref}" == "automation/update-core-pins" ]]; then
                case "${path}" in
                  .github/actions/prepare-update/action.yml|.python-version|.ruby-version)
                    ;;
                  *)
                    valid=false
                    echo "PR #${pr} changes a file outside the core-pin updater allowlist: ${path}"
                    ;;
                esac
              else
                valid=false
                echo "PR #${pr} is not an approved update bot/branch pair"
              fi
            done
            if [ "${valid}" != "true" ]; then
              continue
            fi

            checks_ready=false
            checks_deadline=$((SECONDS + 900))

            while (( SECONDS < checks_deadline )); do
              checks="$(gh pr checks "${pr}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json name,workflow,bucket 2>/dev/null || true)"
              checks="${checks:-[]}"

              if [[ "${pr_author}" == "github-actions[bot]" && "${head_ref}" == "automation/update-core-pins" ]]; then
                pr_head_sha="$(jq -r '.head.sha // empty' <<< "${pr_data}")"
                dispatch_runs="$(gh run list \
                  --repo "${GITHUB_REPOSITORY}" \
                  --workflow validate.yml \
                  --branch "${head_ref}" \
                  --event workflow_dispatch \
                  --limit 50 \
                  --json headSha,status,conclusion)"
                dispatched_ci="$(jq -c --arg sha "${pr_head_sha}" '
                  [
                    .[]
                    | select(.headSha == $sha and .status == "completed" and .conclusion == "success")
                  ]
                  | if length > 0 then [{ "name": "validate", "workflow": "CI", "bucket": "pass" }] else [] end
                ' <<< "${dispatch_runs}")"
                checks="$(jq -s 'add' <(printf '%s\n' "${checks}") <(printf '%s\n' "${dispatched_ci}"))"
              fi

              if bash scripts/update/verify_dependabot_auto_merge_checks.sh <<< "${checks}"; then
                checks_ready=true
                break
              fi

              if jq -e '
                any(.[]?;
                  (
                    .workflow == "CI"
                    or .name == "Analyze (rust)"
                    or .name == "Analyze (ruby)"
                    or .name == "Analyze (python)"
                  )
                  and (.bucket == "fail" or .bucket == "cancel" or .bucket == "skipping")
                )
              ' <<< "${checks}" >/dev/null; then
                echo "A required CI/Rust/Ruby/Python check failed, was cancelled, or was skipped for PR #${pr}; not merging."
                break
              fi

              echo "Required checks are pending or not visible yet for PR #${pr}; retrying in 15 seconds."
              sleep 15
            done

            if [ "${checks_ready}" != "true" ]; then
              echo "Required CI/Rust/Ruby/Python checks did not all pass within 15 minutes for PR #${pr}; skipping."
              continue
            fi

            echo "Required CI/Rust/Ruby/Python checks passed for PR #${pr}; merging."
            merge_args=(
              --repo "${GITHUB_REPOSITORY}"
              --squash
              --delete-branch
            )
            if [[ "${pr_author}" == "github-actions[bot]" && "${head_ref}" == "automation/update-core-pins" ]]; then
              pr_title="$(jq -r '.title // empty' <<< "${pr_data}")"
              if [ -z "${pr_title}" ]; then
                echo "PR #${pr} has no title; refusing to merge without a commit subject."
                exit 1
              fi
              merge_args+=(--subject "${pr_title} (#${pr})")
            fi

            if gh pr merge "${pr}" "${merge_args[@]}"; then
              echo "Merged PR #${pr}."
            else
              state="$(gh pr view "${pr}" --repo "${GITHUB_REPOSITORY}" --json state --jq '.state' 2>/dev/null || true)"
              if [ "${state}" = "MERGED" ]; then
                echo "PR #${pr} was merged by another run."
              else
                echo "Failed to merge PR #${pr}."
                exit 1
              fi
            fi
          done
