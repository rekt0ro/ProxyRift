name: Auto-merge Dependabot

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: dependabot-action-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Merge ready Dependabot tooling updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          open_prs="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" | jq 'add')"
          printf '%s\n' "${open_prs}" | jq -r '.[] | "Open PR #\(.number): author=\(.user.login), draft=\(.draft), head=\(.head.ref)"'

          mapfile -t prs < <(
            printf '%s\n' "${open_prs}" | jq -r '
              .[]
              | select((.user.login == "dependabot[bot]" or (.user.login == "github-actions[bot]" and .head.ref == "automation/update-core-pins")) and .draft == false)
              | .number
            '
          )

          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No open eligible tooling-update PRs."
            exit 0
          fi

          printf 'Eligible tooling-update PRs: %s\n' "${prs[*]}"

          for pr in "${prs[@]}"; do
            echo "Inspecting tooling-update PR #${pr}"

            state="$(gh pr view "${pr}" --repo "${GITHUB_REPOSITORY}" --json state --jq '.state')"
            if [ "${state}" != "OPEN" ]; then
              echo "PR #${pr} is no longer open; skipping."
              continue
            fi

            mapfile -t files < <(
              gh pr view "${pr}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json files \
                --jq '.files[].path'
            )

            if [ "${#files[@]}" -eq 0 ]; then
              echo "PR #${pr} has no changed files; skipping."
              continue
            fi

            valid=true
            for path in "${files[@]}"; do
              case "${path}" in
                .github/workflows/*.yml|.github/workflows/*.yaml|Cargo.toml|Cargo.lock|requirements*.txt)
                  ;;
                *)
                  valid=false
                  echo "PR #${pr} changes an unmanaged file: ${path}"
                  ;;
              esac
            done

            if [ "${valid}" != "true" ]; then
              continue
            fi

            checks="$(gh pr checks "${pr}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json workflow,bucket 2>/dev/null || true)"

            if [ -z "${checks}" ]; then
              echo "No check results for PR #${pr} yet; skipping."
              continue
            fi

            if ! printf '%s' "${checks}" | jq -e '
              [ .[] | select(.workflow == "CI") ] as $ci
              | ($ci | length > 0) and all($ci[]; .bucket == "pass")
            ' >/dev/null; then
              echo "Rust CI has not passed for PR #${pr}; skipping."
              continue
            fi

            echo "Rust CI passed for PR #${pr}; merging."
            if gh pr merge "${pr}" \
              --repo "${GITHUB_REPOSITORY}" \
              --squash \
              --delete-branch; then
              echo "Merged PR #${pr}."
            else
              state="$(gh pr view "${pr}" --repo "${GITHUB_REPOSITORY}" --json state --jq '.state' 2>/dev/null || true)"
              if [ "${state}" = "MERGED" ]; then
                echo "PR #${pr} was merged by another run."
              else
                echo "Failed to merge PR #${pr}."
                exit 1
              fi
            fi
          done
