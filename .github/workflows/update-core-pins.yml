name: Update Core Release Pins

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-core-release-pins
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Require a token for approval-free pull request CI
        env:
          CORE_PIN_UPDATE_TOKEN: ${{ secrets.CORE_PIN_UPDATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CORE_PIN_UPDATE_TOKEN}" ]]; then
            echo "::error::Configure repository secret CORE_PIN_UPDATE_TOKEN with a fine-grained PAT owned by the repository owner. Grant Contents, Pull requests, and Issues read/write access. PRs created with GITHUB_TOKEN require manual workflow approval."
            exit 1
          fi

      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Resolve latest stable releases and update pins
        id: resolve-pins
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_PIN_PR_BODY_PATH: ${{ runner.temp }}/core-pin-pr-body.md
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update/test_update_core_pins.py
          python3 scripts/update/update_core_pins.py
          git diff --check
          bash scripts/update/test_resolve_validation_cores.sh
      - name: Determine labels for changed pins
        id: labels
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'value<<EOF'
            bash scripts/update/resolve_core_pin_labels.sh
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Ensure selected update labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ steps.labels.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            case "$name" in
              dependencies)
                color="0366d6"
                description="Updates to core dependencies: Xray, sing-box, or Mihomo"
                ;;
              toolchain)
                color="6f42c1"
                description="Updates to CI runtimes and toolchain"
                ;;
              python)
                color="3572A5"
                description="Updates to the pinned Python runtime"
                ;;
              ruby)
                color="701516"
                description="Updates to the pinned Ruby runtime"
                ;;
              rust)
                color="dea584"
                description="Updates to the pinned Rust runtime"
                ;;
              xray)
                color="c6538c"
                description="Updates to Xray-core release pins"
                ;;
              sing-box)
                color="b4e197"
                description="Updates to sing-box release pins"
                ;;
              mihomo)
                color="1f883d"
                description="Updates to Mihomo release pins"
                ;;
              *)
                echo "Refusing to create an unrecognized update label: $name" >&2
                exit 1
                ;;
            esac

            if gh api "repos/${GITHUB_REPOSITORY}/labels/${name}" >/dev/null 2>&1; then
              continue
            fi

            echo "Creating repository label: ${name}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f "name=${name}" \
              -f "color=${color}" \
              -f "description=${description}" >/dev/null
          done <<< "$LABELS"

      - name: Replace legacy bot-authored core-pin PR
        env:
          GH_TOKEN: ${{ secrets.CORE_PIN_UPDATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          legacy_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "${GITHUB_REPOSITORY_OWNER}:automation/update-core-pins" \
            --state open \
            --json number,author \
            --jq '.[] | select(.author.login == "github-actions[bot]") | .number' | head -n 1)"

          if [[ -z "$legacy_pr" ]]; then
            echo "No legacy bot-authored core-pin PR needs replacement."
            exit 0
          fi

          mapfile -t changed_files < <(
            gh pr view "$legacy_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --json files \
              --jq '.files[].path'
          )

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "Legacy core-pin PR #$legacy_pr has no changed files; refusing to replace it." >&2
            exit 1
          fi

          for path in "${changed_files[@]}"; do
            case "$path" in
              .github/actions/prepare-update/action.yml|.python-version|.ruby-version|rust-toolchain.toml)
                ;;
              *)
                echo "Legacy core-pin PR #$legacy_pr changes an unapproved file: $path" >&2
                exit 1
                ;;
            esac
          done

          echo "Replacing legacy bot-authored core-pin PR #$legacy_pr with an owner-token-authored PR."
          gh pr close "$legacy_pr" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Replacing this generated PR with an owner-token-authored PR so normal pull_request CI can run without manual workflow approval."

          if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/automation/update-core-pins" >/dev/null 2>&1; then
            echo "::warning::The legacy branch could not be deleted after closing the PR; the updater will try to reuse it."
          fi

      - name: Create or update core-pin pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CORE_PIN_UPDATE_TOKEN }}
          base: main
          branch: automation/update-core-pins
          delete-branch: true
          add-paths: |
            .github/actions/prepare-update/action.yml
            .python-version
            .ruby-version
            rust-toolchain.toml
          commit-message: ${{ steps.resolve-pins.outputs.pr_title }}
          title: ${{ steps.resolve-pins.outputs.pr_title }}
          body-path: ${{ runner.temp }}/core-pin-pr-body.md

      - name: Synchronize core-pin PR labels
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          SELECTED_LABELS: ${{ steps.labels.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          selected_labels=()
          while IFS= read -r label; do
            [[ -n "$label" ]] && selected_labels+=("$label")
          done <<< "$SELECTED_LABELS"

          current_labels=()
          mapfile -t current_labels < <(
            gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json labels \
              --jq '.labels[].name'
          )

          contains_label() {
            local wanted="$1"
            shift
            local label
            for label in "$@"; do
              [[ "$label" == "$wanted" ]] && return 0
            done
            return 1
          }

          managed_labels=(dependencies toolchain python ruby rust xray sing-box mihomo)
          for label in "${managed_labels[@]}"; do
            if contains_label "$label" "${selected_labels[@]}"; then
              if ! contains_label "$label" "${current_labels[@]}"; then
                gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$label"
              fi
            elif contains_label "$label" "${current_labels[@]}"; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label"
            fi
          done
