name: Update Core Release Pins

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-core-release-pins
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Resolve latest stable releases and update pins
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update/test_update_core_pins.py
          python3 scripts/update/update_core_pins.py
          git diff --check
          bash scripts/update/test_resolve_validation_cores.sh
      - name: Determine labels for changed pins
        id: labels
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'value<<EOF'
            bash scripts/update/resolve_core_pin_labels.sh
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Ensure selected update labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ steps.labels.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            case "$name" in
              dependencies)
                color="0366d6"
                description="Updates to core dependencies: Xray, sing-box, or Mihomo"
                ;;
              toolchain)
                color="6f42c1"
                description="Updates to CI runtimes and toolchain"
                ;;
              python)
                color="3572A5"
                description="Updates to the pinned Python runtime"
                ;;
              ruby)
                color="701516"
                description="Updates to the pinned Ruby runtime"
                ;;
              xray)
                color="c6538c"
                description="Updates to Xray-core release pins"
                ;;
              sing-box)
                color="b4e197"
                description="Updates to sing-box release pins"
                ;;
              mihomo)
                color="1f883d"
                description="Updates to Mihomo release pins"
                ;;
              *)
                echo "Refusing to create an unrecognized update label: $name" >&2
                exit 1
                ;;
            esac

            if gh api "repos/${GITHUB_REPOSITORY}/labels/${name}" >/dev/null 2>&1; then
              continue
            fi

            echo "Creating repository label: ${name}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f "name=${name}" \
              -f "color=${color}" \
              -f "description=${description}" >/dev/null
          done <<< "$LABELS"

      - name: Create or update core-pin pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/update-core-pins
          delete-branch: true
          add-paths: |
            .github/actions/prepare-update/action.yml
            .python-version
            .ruby-version
          commit-message: "chore: update core and runtime versions"
          title: "chore: update core and runtime versions"
          labels: ${{ steps.labels.outputs.value }}
          body: |
            Automated update of the pinned Python and Ruby runtimes plus Xray-core, sing-box, and Mihomo releases used by CI and subscription validation.

            Python is resolved from the official python.org stable-release list. Ruby and Xray-core, sing-box, and Mihomo versions come from their official GitHub Releases APIs; core asset names and SHA-256 digests are validated before any pins are changed.

            The generated PR is validated by the repository's CI before the auto-merge workflow evaluates it.

      - name: Synchronize core-pin PR labels
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          SELECTED_LABELS: ${{ steps.labels.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          selected_labels=()
          while IFS= read -r label; do
            [[ -n "$label" ]] && selected_labels+=("$label")
          done <<< "$SELECTED_LABELS"

          current_labels=()
          mapfile -t current_labels < <(
            gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json labels \
              --jq '.labels[].name'
          )

          contains_label() {
            local wanted="$1"
            shift
            local label
            for label in "$@"; do
              [[ "$label" == "$wanted" ]] && return 0
            done
            return 1
          }

          managed_labels=(dependencies toolchain python ruby xray sing-box mihomo)
          for label in "${managed_labels[@]}"; do
            if contains_label "$label" "${selected_labels[@]}"; then
              if ! contains_label "$label" "${current_labels[@]}"; then
                gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$label"
              fi
            elif contains_label "$label" "${current_labels[@]}"; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label"
            fi
          done

      - name: Dispatch validation CI for the generated PR
        id: dispatch-ci
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid \
            --jq '.headRefOid')"

          prior_run_ids="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow validate.yml \
            --branch automation/update-core-pins \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId | jq '[.[].databaseId]')"

          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "prior-run-ids=$prior_run_ids" >> "$GITHUB_OUTPUT"

          gh workflow run validate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref automation/update-core-pins

      - name: Wait for Rust CI to finish
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.dispatch-ci.outputs.head-sha }}
          PRIOR_RUN_IDS: ${{ steps.dispatch-ci.outputs.prior-run-ids }}
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 3300))
          ci_conclusion=""

          while (( SECONDS < deadline )); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow validate.yml \
              --branch automation/update-core-pins \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha,status,conclusion)"

            run_id="$(jq -r \
              --arg sha "$EXPECTED_HEAD_SHA" \
              --argjson prior "$PRIOR_RUN_IDS" '
                [
                  .[]
                  | select(.headSha == $sha)
                  | select(.databaseId as $id | ($prior | index($id)) == null)
                ]
                | first
                | .databaseId // empty
              ' <<< "$runs")"

            if [[ -n "$run_id" ]]; then
              run_details="$(gh run view "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --json status,conclusion)"
              status="$(jq -r '.status' <<< "$run_details")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$run_details")"

              if [[ "$status" == "completed" ]]; then
                ci_conclusion="$conclusion"
                break
              fi
            fi

            sleep 15
          done

          if [[ "$ci_conclusion" != "success" ]]; then
            echo "Validation CI did not succeed; leaving the core update PR open for inspection." >&2
            exit 1
          fi

          echo "Validation CI passed for $EXPECTED_HEAD_SHA."

      - name: Request auto-merge evaluation
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run dependabot-auto-merge.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
