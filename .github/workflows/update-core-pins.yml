name: Update Core Release Pins

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-core-release-pins
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Resolve latest stable releases and update pins
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update/test_update_core_pins.py
          python3 scripts/update/update_core_pins.py
          git diff --check
          bash scripts/update/test_resolve_validation_cores.sh
      - name: Ensure update labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r name color description; do
            if gh api "repos/${GITHUB_REPOSITORY}/labels/${name}" >/dev/null 2>&1; then
              continue
            fi
            echo "Creating repository label: ${name}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
              -f "name=${name}" \
              -f "color=${color}" \
              -f "description=${description}" >/dev/null
          done <<'LABELS'
          dependencies|0366d6|Automated dependency and release pin updates
          python|3572A5|Updates to the Python runtime pin
          ruby|701516|Updates to the Ruby runtime pin
          xray|c6538c|Updates to Xray-core release pins
          sing-box|b4e197|Updates to sing-box release pins
          mihomo|1f883d|Updates to Mihomo release pins
          LABELS

      - name: Determine labels for changed pins
        id: labels
        shell: bash
        run: |
          set -euo pipefail
          labels=("dependencies")

          if ! git diff --quiet -- .python-version; then
            labels+=("python")
          fi
          if ! git diff --quiet -- .ruby-version; then
            labels+=("ruby")
          fi

          pin_diff="$(git diff --unified=0 -- .github/actions/prepare-update/action.yml)"
          if grep -Eq '^[+-][[:space:]]*XRAY_(VERSION|SHA256|ASSET)_PIN:' <<< "${pin_diff}"; then
            labels+=("xray")
          fi
          if grep -Eq '^[+-][[:space:]]*SINGBOX_(VERSION|SHA256|ASSET)_PIN:' <<< "${pin_diff}"; then
            labels+=("sing-box")
          fi
          if grep -Eq '^[+-][[:space:]]*MIHOMO_(VERSION|SHA256|ASSET)_PIN:' <<< "${pin_diff}"; then
            labels+=("mihomo")
          fi

          {
            echo 'value<<EOF'
            printf '%s\n' "${labels[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create or update core-pin pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/update-core-pins
          delete-branch: true
          add-paths: |
            .github/actions/prepare-update/action.yml
            .python-version
            .ruby-version
          commit-message: "chore: update core and runtime versions"
          title: "chore: update core and runtime versions"
          labels: ${{ steps.labels.outputs.value }}
          body: |
            Automated update of the pinned Python and Ruby runtimes plus Xray-core, sing-box, and Mihomo releases used by CI and subscription validation.

            Python is resolved from the official python.org stable-release list. Ruby and Xray-core, sing-box, and Mihomo versions come from their official GitHub Releases APIs; core asset names and SHA-256 digests are validated before any pins are changed.

            The generated PR is validated by the repository's CI before the auto-merge workflow evaluates it.

      - name: Dispatch validation CI for the generated PR
        id: dispatch-ci
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid \
            --jq '.headRefOid')"

          prior_run_ids="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow validate.yml \
            --branch automation/update-core-pins \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId | jq '[.[].databaseId]')"

          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "prior-run-ids=$prior_run_ids" >> "$GITHUB_OUTPUT"

          gh workflow run validate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref automation/update-core-pins

      - name: Wait for Rust CI to finish
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.dispatch-ci.outputs.head-sha }}
          PRIOR_RUN_IDS: ${{ steps.dispatch-ci.outputs.prior-run-ids }}
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 3300))
          ci_conclusion=""

          while (( SECONDS < deadline )); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow validate.yml \
              --branch automation/update-core-pins \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha,status,conclusion)"

            run_id="$(jq -r \
              --arg sha "$EXPECTED_HEAD_SHA" \
              --argjson prior "$PRIOR_RUN_IDS" '
                [
                  .[]
                  | select(.headSha == $sha)
                  | select(.databaseId as $id | ($prior | index($id)) == null)
                ]
                | first
                | .databaseId // empty
              ' <<< "$runs")"

            if [[ -n "$run_id" ]]; then
              run_details="$(gh run view "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --json status,conclusion)"
              status="$(jq -r '.status' <<< "$run_details")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$run_details")"

              if [[ "$status" == "completed" ]]; then
                ci_conclusion="$conclusion"
                break
              fi
            fi

            sleep 15
          done

          if [[ "$ci_conclusion" != "success" ]]; then
            echo "Validation CI did not succeed; leaving the core update PR open for inspection." >&2
            exit 1
          fi

          echo "Validation CI passed for $EXPECTED_HEAD_SHA."

      - name: Request auto-merge evaluation
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run dependabot-auto-merge.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
