name: Update Core Release Pins

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-core-release-pins
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Resolve latest stable releases and update pins
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update/update_core_pins.py
          git diff --check
          bash scripts/update/test_resolve_validation_cores.sh
      - name: Create or update core-pin pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/update-core-pins
          delete-branch: true
          add-paths: |
            .github/actions/prepare-update/action.yml
            .github/workflows/validate.yml
            .ruby-version
          commit-message: "chore: update core and Ruby versions"
          title: "chore: update core and Ruby versions"
          body: |
            Automated update of the pinned Xray-core, sing-box, and Mihomo releases plus the exact stable Ruby version used by CI and subscription validation.

            Versions, Linux asset names, and SHA-256 digests are read from each project's official GitHub Releases API. The updater refuses to create changes if the release tags, asset names, or digests do not match the expected format.

            The PR is validated by the repository's Rust CI before the auto-merge workflow is asked to merge it.

      - name: Dispatch Rust CI for the generated PR
        id: dispatch-ci
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid \
            --jq '.headRefOid')"

          prior_run_ids="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow validate.yml \
            --branch automation/update-core-pins \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId | jq '[.[].databaseId]')"

          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "prior-run-ids=$prior_run_ids" >> "$GITHUB_OUTPUT"

          gh workflow run validate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref automation/update-core-pins

      - name: Wait for Rust CI to finish
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.dispatch-ci.outputs.head-sha }}
          PRIOR_RUN_IDS: ${{ steps.dispatch-ci.outputs.prior-run-ids }}
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 3300))
          ci_conclusion=""

          while (( SECONDS < deadline )); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow validate.yml \
              --branch automation/update-core-pins \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha,status,conclusion)"

            run_id="$(jq -r \
              --arg sha "$EXPECTED_HEAD_SHA" \
              --argjson prior "$PRIOR_RUN_IDS" '
                [
                  .[]
                  | select(.headSha == $sha)
                  | select(.databaseId as $id | ($prior | index($id)) == null)
                ]
                | first
                | .databaseId // empty
              ' <<< "$runs")"

            if [[ -n "$run_id" ]]; then
              run_details="$(gh run view "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --json status,conclusion)"
              status="$(jq -r '.status' <<< "$run_details")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$run_details")"

              if [[ "$status" == "completed" ]]; then
                ci_conclusion="$conclusion"
                break
              fi
            fi

            sleep 15
          done

          if [[ "$ci_conclusion" != "success" ]]; then
            echo "Rust CI did not succeed; leaving the core update PR open for inspection." >&2
            exit 1
          fi

          echo "Rust CI passed for $EXPECTED_HEAD_SHA."

      - name: Request auto-merge evaluation
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run dependabot-auto-merge.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
